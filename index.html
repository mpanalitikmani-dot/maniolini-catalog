<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MANIOLINI — каталог</title>
  <meta name="description" content="Мини-каталог MANIOLINI: хиты, одежда, обувь. Напишите менеджеру — поможем с размером и заказом.">
  <meta property="og:title" content="MANIOLINI — каталог">
  <meta property="og:description" content="Хиты, одежда, обувь. Напишите менеджеру — поможем с размером и заказом.">
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="config.js"></script>
</head>
<body>
  <header class="top">
    <img class="logo" src="assets/logo.png" alt="MANIOLINI">
    <button class="icon-btn" id="searchToggle" aria-label="Поиск">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
  </header>
  <div class="search" id="searchBox" hidden>
    <input id="search" type="search" placeholder="Сапоги, брюки, пальто…" autocomplete="off">
  </div>

  <main>
    <section class="hits" id="hitsSection">
      <div class="section-head">
        <h2>Хиты продаж</h2>
        <span class="muted" id="hitsCount"></span>
      </div>
      <div class="carousel" id="hits"></div>
    </section>

    <section class="catalog">
      <div class="section-head"><h2>Каталог</h2><span class="muted" id="count"></span></div>
      <nav class="chips" id="cats"></nav>
      <nav class="chips chips--sub" id="subs"></nav>
      <nav class="chips chips--filters" id="filters">
        <button class="chip chip--filter" data-filter="size"><span>Размер</span> ▾</button>
        <button class="chip chip--filter" data-filter="color"><span>Цвет</span> ▾</button>
        <button class="chip chip--reset" id="resetFilters" hidden>Сбросить ✕</button>
      </nav>
      <div class="grid" id="grid"></div>
      <button class="more" id="more" hidden>Показать ещё</button>
      <p class="empty" id="empty" hidden>Ничего не нашлось — напишите менеджеру, подберём.</p>
    </section>

    <footer class="foot">
      <a id="siteLink" target="_blank" rel="noopener">Полный каталог на maniolini.ru</a>
      <span class="muted" id="updated"></span>
    </footer>
  </main>

  <div class="cta" id="cta">
    <button class="btn btn--primary" id="writeBtn">Написать менеджеру</button>
  </div>

  <!-- Карточка товара -->
  <div class="sheet" id="product" hidden>
    <div class="sheet__backdrop" data-close></div>
    <div class="sheet__panel" role="dialog" aria-modal="true">
      <button class="sheet__close icon-btn" data-close aria-label="Закрыть">✕</button>
      <div class="gallery" id="pGallery"></div>
      <div class="dots" id="pDots"></div>
      <div class="sheet__body">
        <div class="stickers" id="pStickers"></div>
        <h3 id="pName"></h3>
        <div class="muted" id="pSection"></div>
        <div class="price price--lg" id="pPrice"></div>
        <div class="variant" id="pColorsBox">
          <div class="variant__label">Цвет: <b id="pColorName"></b></div>
          <div class="swatches" id="pColors"></div>
        </div>
        <div class="variant" id="pSizesBox">
          <div class="variant__label">Размер: <b id="pSizeName"></b></div>
          <div class="sizes" id="pSizes"></div>
        </div>
        <button class="btn btn--primary" id="pWrite">Написать менеджеру о товаре</button>
        <a class="btn btn--ghost" id="pSite" target="_blank" rel="noopener">Открыть на сайте</a>
      </div>
    </div>
  </div>

  <!-- Выбор канала связи -->
  <div class="sheet" id="contact" hidden>
    <div class="sheet__backdrop" data-close></div>
    <div class="sheet__panel sheet__panel--small" role="dialog" aria-modal="true">
      <div class="sheet__body">
        <h3>Как удобнее связаться?</h3>
        <p class="muted" id="cHint">Текст сообщения скопирован — просто вставьте его в чат.</p>
        <div class="contact-list" id="cList"></div>
        <button class="btn btn--ghost" data-close>Отмена</button>
      </div>
    </div>
  </div>

  <!-- Фильтр по размеру / цвету -->
  <div class="sheet" id="filterSheet" hidden>
    <div class="sheet__backdrop" data-close></div>
    <div class="sheet__panel sheet__panel--small" role="dialog" aria-modal="true">
      <div class="sheet__body">
        <h3 id="fTitle"></h3>
        <div class="filter-options" id="fOptions"></div>
        <button class="btn btn--ghost" data-close>Готово</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
